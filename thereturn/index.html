<script>
(() => {
"use strict";

/* ═══════════════ CONSTANTS ═══════════════ */
const W = 960, H = 640;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

/* ═══════════════ ART ═══════════════
   All original Us Need Wipe artwork, straight from the game.
   ═══════════════════════════════════ */
const ART_FILES = {
  logo:    'UsNeedWipeLogo.png',      // title card
  logoSm:  'logo.png',                // small in-game mark
  bg:      'background-scene.jpg',    // castle valley
  bg2:     'BackgroundOne.png',       // castle valley, alt crop
  bgBoss:  'CastleBackground.png',    // the castle itself — boss levels
  player:  'player-token.png',        // you
  hero:    'HappyToiletPaperMan.png', // you, victorious
  caped:   'wipe-fail.png',           // you, with Bidet Overdrive
  badwipe: 'BadWipeNew.png',          // you, on the wipe screen
  bush1:   'AngryBushOne.png',
  bush2:   'AngryBushTwo.png',
  bushT1:  'bush-token-1.png',
  bushT2:  'bush-token-2.png',
  legion:  'legion.png',
  reaper:  'reaper.png',
  king:    'king-log.png',
  clean:   'wipe-clean.png',          // CLEAN-O — the one decent bush
  cleanBig:'CleanO.png',
  finish:  'finish-tile.png',
  toilet:  'HappyToilet.png',
};
/* Deployed at usneedwipe.com/thereturn the artwork already lives at the site
   root, so we point there instead of shipping a second 19 MB copy. */
const ART_BASE = /(^|\/)thereturn(\/|$)/i.test(location.pathname) ? '/' : 'assets/';
const IMG = {};
let artLoaded = 0, artTotal = Object.keys(ART_FILES).length;
for (const key in ART_FILES){
  const im = new Image();
  im.onload  = () => { artLoaded++; };
  im.onerror = () => { artLoaded++; im.failed = true; };
  im.src = ART_BASE + ART_FILES[key];
  IMG[key] = im;
}
const artReady = () => artLoaded >= artTotal;
const ok = im => im && im.complete && !im.failed && im.naturalWidth > 0;

/* draw an image centred on (x,y), scaled to a target height, aspect preserved */
function sprite(im, x, y, targetH, rot, alpha, flip){
  if (!ok(im)) return;
  const s = targetH / im.naturalHeight;
  const w = im.naturalWidth * s, h = targetH;
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (flip) ctx.scale(-1, 1);
  if (alpha != null) ctx.globalAlpha = alpha;
  ctx.drawImage(im, -w/2, -h/2, w, h);
  ctx.restore();
}
/* same, but cropped from the source — used to trim the stat card off BadWipeNew */
function spriteCrop(im, x, y, targetH, sx, sy, sw, sh, alpha){
  if (!ok(im)) return;
  const s = targetH / sh;
  const w = sw * s, h = targetH;
  ctx.save();
  ctx.translate(x, y);
  if (alpha != null) ctx.globalAlpha = alpha;
  ctx.drawImage(im, sx, sy, sw, sh, -w/2, -h/2, w, h);
  ctx.restore();
}

/* ═══════════════ RNG ═══════════════ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI*2;

/* ═══════════════ PERSISTENT META ═══════════════
   Death is not a reset. Every wipe advances the STALL, which reseeds
   every sound bank, repaints the garden and makes the bushes angrier.
   Ply (currency) is lifetime and never spent — it only unlocks.
   ═════════════════════════════════════════════ */
const TITLE = 'US NEED WIPE';
const VERSION = 'THE SEQUEL';
const VERSION_NAME = 'ANGRY BUSHES RETURN';
const SAVE_KEY = 'usneedwipe.abr.save.v1';
const DEFAULT_SAVE = { stall:1, ply:0, bestSheets:0, bestLevel:0, runs:0, muted:false };
let save = loadSave();

function loadSave(){
  try { return Object.assign({}, DEFAULT_SAVE, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); }
  catch(e){ return Object.assign({}, DEFAULT_SAVE); }
}
function persist(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){}
}

const UNLOCKS = [
  { id:'single',    ply:0,    name:'SINGLE PLY',      desc:'One sheet. One barrel. Humble beginnings.' },
  { id:'double',    ply:120,  name:'DOUBLE PLY',      desc:'Twin barrels. Twice the dignity.' },
  { id:'quilted',   ply:340,  name:'QUILTED',         desc:'Absorbs one bush per level.' },
  { id:'aloe',      ply:700,  name:'ALOE INFUSED',    desc:'Two extra sheets, fanned wide.' },
  { id:'wetwipe',   ply:1200, name:'WET WIPE DRONE',  desc:'An orbiting friend that fires on its own.' },
  { id:'bidet',     ply:2000, name:'BIDET OVERDRIVE', desc:'+45% fire rate. Pressurised.' },
];
const owns = id => { const u = UNLOCKS.find(u => u.id === id); return !!u && save.ply >= u.ply; };
const nextUnlock = () => UNLOCKS.find(u => save.ply < u.ply) || null;

/* ═══════════════ AUDIO ═══════════════
   Everything is synthesised at runtime. A level's whole palette — scale,
   waveforms, tempo, filter, rustle character — is derived from its seed,
   so "new level" literally means "new sounds".
   ═════════════════════════════════════ */
let AC = null, masterGain = null, musicGain = null, sfxGain = null, noiseBuf = null;
let revSend = null, revNode = null, delaySend = null;

const mtof = m => 440 * Math.pow(2,(m-69)/12);
const NOTE_NAMES = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

/* chord vocabulary — 7ths and 9ths only. nothing tense, nothing crunchy. */
const QUAL = {
  maj9: [0,4,7,11,14],
  maj7: [0,4,7,11],
  m9:   [0,3,7,10,14],
  m7:   [0,3,7,10],
  dom9: [0,4,7,10,14],
  sus9: [0,5,7,10,14],
};
/* [semitones from key root, quality] — one chord per bar, four bars */
const PROGS = [
  { name:'I–vi–ii–V',   ch:[[0,'maj9'],[9,'m9'],[2,'m9'],[7,'dom9']] },
  { name:'ii–V–I–IV',   ch:[[2,'m9'],[7,'dom9'],[0,'maj9'],[5,'maj9']] },
  { name:'vi–IV–I–V',   ch:[[9,'m9'],[5,'maj9'],[0,'maj9'],[7,'dom9']] },
  { name:'I–IV–ii–V',   ch:[[0,'maj9'],[5,'maj9'],[2,'m9'],[7,'sus9']] },
  { name:'I–bIII–IV–V', ch:[[0,'maj9'],[3,'maj7'],[5,'maj9'],[7,'dom9']] },
  { name:'ii–V–iii–vi', ch:[[2,'m9'],[7,'dom9'],[4,'m9'],[9,'m9']] },
  { name:'i–bVI–iv–V',  ch:[[0,'m9'],[8,'maj9'],[5,'m9'],[7,'dom9']] },
  { name:'i–bVII–IV–v', ch:[[0,'m9'],[10,'maj9'],[5,'maj9'],[3,'maj7']] },
];
/* Rhodes comping — syncopated, plenty of air */
const COMPS = [
  [0,6,10,14],
  [0,3,8,11],
  [2,6,9,14],
  [0,7,10],
  [0,6,8,13],
];
/* [step, semitones above chord root] */
const BASSES = [
  [[0,0],[8,0],[14,7]],
  [[0,0],[6,0],[10,7],[14,12]],
  [[0,0],[4,12],[8,0],[12,7]],
  [[0,0],[9,5],[12,7]],
];

function initAudio(){
  if (AC) return;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  AC = new Ctor();
  masterGain = AC.createGain(); masterGain.gain.value = 0.9; masterGain.connect(AC.destination);
  musicGain  = AC.createGain(); musicGain.gain.value  = 0.30; musicGain.connect(masterGain);
  sfxGain    = AC.createGain(); sfxGain.gain.value    = 0.46; sfxGain.connect(masterGain);

  const len = AC.sampleRate * 1.2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = Math.random()*2 - 1;

  // plate-ish reverb: the entire yacht rock sound is in the tail
  revNode = AC.createConvolver();
  revNode.buffer = makeIR(2.4, 3.2);
  const revTone = AC.createBiquadFilter();
  revTone.type = 'lowpass'; revTone.frequency.value = 4200;
  revSend = AC.createGain(); revSend.gain.value = 1;
  revSend.connect(revNode); revNode.connect(revTone); revTone.connect(musicGain);

  // eighth-note delay for the lead
  const dly = AC.createDelay(1.0); dly.delayTime.value = 0.32;
  const fb = AC.createGain(); fb.gain.value = 0.30;
  const dlyTone = AC.createBiquadFilter();
  dlyTone.type = 'lowpass'; dlyTone.frequency.value = 3000;
  delaySend = AC.createGain(); delaySend.gain.value = 1;
  delaySend.connect(dly); dly.connect(dlyTone); dlyTone.connect(fb); fb.connect(dly);
  dlyTone.connect(musicGain);

  applyMute();
}
function makeIR(seconds, decay){
  const len = Math.floor(AC.sampleRate * seconds);
  const buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
  }
  return buf;
}
function applyMute(){ if (masterGain) masterGain.gain.value = save.muted ? 0 : 0.9; }

function blip(freq, dur, wave, vol, slideTo, when){
  if (!AC || save.muted) return;
  const t = when || AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = wave; o.frequency.setValueAtTime(Math.max(20,freq), t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(sfxGain);
  o.start(t); o.stop(t+dur+0.03);
}
function rustle(dur, freq, vol, q, sweepTo, when){
  if (!AC || save.muted) return;
  const t = when || AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  s.playbackRate.value = 0.7 + Math.random()*0.6;
  const f = AC.createBiquadFilter();
  f.type = 'bandpass'; f.Q.value = q || 1.2;
  f.frequency.setValueAtTime(Math.max(60,freq), t);
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(60,sweepTo), t+dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(f); f.connect(g); g.connect(sfxGain);
  s.start(t); s.stop(t+dur+0.03);
}
/* ── yacht rock voices ── */
function sendTo(node, revAmt, dlyAmt){
  if (revAmt && revSend){ const g = AC.createGain(); g.gain.value = revAmt; node.connect(g); g.connect(revSend); }
  if (dlyAmt && delaySend){ const g = AC.createGain(); g.gain.value = dlyAmt; node.connect(g); g.connect(delaySend); }
}

/* two-operator FM electric piano — the whole genre in one function */
function rhodes(midi, dur, vol, t, ratio, rev){
  if (!AC || save.muted) return;
  const f = mtof(midi);
  const car = AC.createOscillator(); car.type = 'sine'; car.frequency.value = f;
  const mod = AC.createOscillator(); mod.type = 'sine'; mod.frequency.value = f * (ratio || 3);
  const modAmt = AC.createGain();
  modAmt.gain.setValueAtTime(f * 2.6, t);
  modAmt.gain.exponentialRampToValueAtTime(f * 0.04, t + Math.min(0.55, dur));
  mod.connect(modAmt); modAmt.connect(car.frequency);

  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3000; lp.Q.value = 0.4;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.016);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  car.connect(lp); lp.connect(g); g.connect(musicGain);
  sendTo(g, rev == null ? 0.30 : rev, 0);
  mod.start(t); car.start(t);
  mod.stop(t + dur + 0.05); car.stop(t + dur + 0.05);
}

/* round, fretless-adjacent bass */
function bassNote(midi, dur, vol, t){
  if (!AC || save.muted) return;
  const o = AC.createOscillator(), o2 = AC.createOscillator();
  o.type = 'triangle'; o2.type = 'sine';
  o.frequency.value = mtof(midi); o2.frequency.value = mtof(midi - 12);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 1.1;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.03);
  g.gain.setValueAtTime(vol, t + dur * 0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(musicGain);
  o.start(t); o2.start(t); o.stop(t + dur + 0.04); o2.stop(t + dur + 0.04);
}

/* soft sine lead with a slow vibrato and a lot of tail */
function softLead(midi, dur, vol, t){
  if (!AC || save.muted) return;
  const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(midi);
  const vib = AC.createOscillator(); vib.type = 'sine'; vib.frequency.value = 5.2;
  const vibAmt = AC.createGain();
  vibAmt.gain.setValueAtTime(0, t);
  vibAmt.gain.linearRampToValueAtTime(mtof(midi) * 0.008, t + dur * 0.55);
  vib.connect(vibAmt); vibAmt.connect(o.frequency);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.09);
  g.gain.setValueAtTime(vol, t + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musicGain);
  sendTo(g, 0.45, 0.28);
  vib.start(t); o.start(t);
  vib.stop(t + dur + 0.05); o.stop(t + dur + 0.05);
}

/* warm sustained pad, used to lean on the boss */
function pad(midi, dur, vol, t){
  if (!AC || save.muted) return;
  const o = AC.createOscillator(), o2 = AC.createOscillator();
  o.type = 'sawtooth'; o2.type = 'sawtooth';
  o.frequency.value = mtof(midi); o2.frequency.value = mtof(midi) * 1.006;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(400, t);
  lp.frequency.linearRampToValueAtTime(1100, t + dur * 0.5);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(musicGain);
  sendTo(g, 0.5, 0);
  o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}

/* ── soft kit ── */
function kick(t, vol){
  if (!AC || save.muted) return;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(115, t);
  o.frequency.exponentialRampToValueAtTime(44, t + 0.14);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + 0.3);
}
function snare(t, vol){
  if (!AC || save.muted) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 0.8;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  s.connect(f); f.connect(g); g.connect(musicGain);
  sendTo(g, 0.55, 0);
  s.start(t); s.stop(t + 0.2);
  const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = 195;
  const og = AC.createGain();
  og.gain.setValueAtTime(vol * 0.5, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.10);
  o.connect(og); og.connect(musicGain);
  o.start(t); o.stop(t + 0.14);
}
function hat(t, vol, open){
  if (!AC || save.muted) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  s.playbackRate.value = 1.4;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7200;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (open ? 0.20 : 0.045));
  s.connect(f); f.connect(g); g.connect(musicGain);
  sendTo(g, 0.2, 0);
  s.start(t); s.stop(t + 0.25);
}

/* per-level sound + colour bank */
let bank = null;
let curChord = [];   // live chord tones — the SFX borrow from these
function makeBank(seed, level, stall){
  const r = mulberry32(seed >>> 0);
  const hue = Math.floor(r()*360);
  const rage = clamp((level + (stall-1)*3) / 26, 0, 1);
  const prog = PROGS[Math.floor(r()*PROGS.length)];
  // stays in yacht territory: 82–108bpm, and it never really speeds up.
  // the bushes get faster. the groove stays exactly this relaxed.
  const tempo = 82 + r()*22 + Math.min(6, level*0.4);
  return {
    root:       38 + Math.floor(r()*8),
    prog,
    comp:       COMPS[Math.floor(r()*COMPS.length)],
    bassPat:    BASSES[Math.floor(r()*BASSES.length)],
    tempo,
    swing:      0.12 + r()*0.10,
    ratio:      2 + Math.floor(r()*3),          // Rhodes bell character
    leadPat:    Array.from({length:16}, () => r() < 0.16 ? Math.floor(r()*5) : -1),
    openHat:    r() < 0.5 ? 6 : 14,
    rustleTone: 500 + r()*1400,
    hue,
    hue2:       (hue + 140 + Math.floor(r()*80)) % 360,
    leafHue:    (95 + Math.floor(r()*40) - rage*70 + 360) % 360, // greener → angrier red
    rage,
  };
}
function keyName(b){ return NOTE_NAMES[b.root % 12]; }
function chordAt(b, bar){
  const [deg, qual] = b.prog.ch[bar % 4];
  return { root: b.root + deg, notes: (QUAL[qual] || QUAL.maj7).map(n => b.root + deg + 12 + n) };
}

let nextStepTime = 0, musicStep = 0;
function scheduleMusic(){
  if (!AC || !bank || save.muted) return;
  const stepDur = (60 / bank.tempo) / 4;
  if (nextStepTime < AC.currentTime) nextStepTime = AC.currentTime + 0.06;
  while (nextStepTime < AC.currentTime + 0.20){
    // swing the off-16ths — nothing sounds relaxed on a straight grid
    const swung = (musicStep % 2 === 1) ? stepDur * bank.swing : 0;
    playStep(musicStep, nextStepTime + swung, stepDur);
    nextStepTime += stepDur;
    musicStep = (musicStep + 1) % 64;   // four bars
  }
}
function playStep(s, t, stepDur){
  const bar = (s >> 4) % 4, k = s % 16;
  const beat = stepDur * 4;
  const ch = chordAt(bank, bar);
  if (k === 0) curChord = ch.notes;

  // Rhodes comping — rolled, never blocked
  if (bank.comp.indexOf(k) !== -1){
    const dur = beat * (k >= 10 ? 1.0 : 1.5);
    ch.notes.forEach((n, i) => rhodes(n, dur, 0.085, t + i*0.013, bank.ratio));
  }
  // bass
  for (const [step, off] of bank.bassPat){
    if (step === k) bassNote(ch.root + off, beat * 0.9, 0.22, t);
  }
  // kit
  if (k === 0 || k === 10) kick(t, 0.34);
  if (k === 4 || k === 12) snare(t, 0.16);
  if (k % 2 === 0) hat(t, k % 4 === 0 ? 0.045 : 0.028, false);
  if (k === bank.openHat) hat(t, 0.05, true);

  // lead motif drifts in on the second half of the phrase
  const l = bank.leadPat[k];
  if (l >= 0 && bar % 2 === 1){
    softLead(ch.notes[l % ch.notes.length] + 12, beat * 1.4, 0.075, t);
  }
  // the Bramble Lord gets a pad. even the boss fight is chill.
  if (boss && k === 0 && bar % 2 === 0) pad(ch.root, beat * 7.5, 0.055, t);
}

/* ═══════════════ SFX ═══════════════ */
/* every sound effect is tuned to the chord that's currently playing,
   so the shooting stays part of the arrangement instead of fighting it */
function chordTone(i){
  if (!curChord.length) return bank ? bank.root + 12 : 60;
  return curChord[((i % curChord.length) + curChord.length) % curChord.length];
}
let shootIdx = 0;
const sfx = {
  shoot(){
    if (!bank) return;
    rhodes(chordTone(shootIdx++) + 24, 0.13, 0.028, AC ? AC.currentTime : 0, 6, 0.18);
  },
  hit(){ if (!bank) return; rustle(0.10, bank.rustleTone, 0.11, 1.4, bank.rustleTone*0.6); },
  bushDie(){
    if (!bank || !AC) return;
    rustle(0.36, bank.rustleTone*1.3, 0.20, 0.8, 130);
    rhodes(chordTone(shootIdx + 2) - 12, 0.5, 0.07, AC.currentTime, 2, 0.45);
  },
  bossDie(){
    if (!bank || !AC) return;
    rustle(1.2, 1600, 0.30, 0.55, 70);
    for (let i=0;i<8;i++) rhodes(chordTone(7-i) + 12 - i*2, 0.9, 0.10, AC.currentTime + i*0.09, 3, 0.6);
  },
  hurt(){
    if (!AC) return;
    kick(AC.currentTime, 0.4);
    rustle(0.55, 240, 0.22, 0.7, 70);
    softLead(chordTone(0) - 12, 0.7, 0.09, AC.currentTime);
  },
  levelUp(){
    if (!bank || !AC) return;
    const c = chordAt(bank, 0).notes;
    c.forEach((n,i) => rhodes(n + 12, 0.7, 0.11, AC.currentTime + i*0.09, bank.ratio, 0.5));
  },
  unlock(){
    if (!bank || !AC) return;
    const c = chordAt(bank, 0).notes;
    [0,1,2,3,4].forEach((k,i) => rhodes(c[k % c.length] + 24, 0.55, 0.10, AC.currentTime + i*0.075, 4, 0.55));
    softLead(c[c.length-1] + 24, 1.2, 0.08, AC.currentTime + 0.4);
  },
  rageUp(){
    if (!AC) return;
    pad(chordTone(0) - 24, 1.4, 0.07, AC.currentTime);
    rustle(0.35, 420, 0.14, 1.3, 130);
  },
};

/* ═══════════════ GAME STATE ═══════════════ */
let state = 'menu';          // menu | play | clear | wiped | pause
let stall = save.stall;      // advances on every wipe
let level = 1;
let dl = 1;                  // effective difficulty level
let sheets = 0;              // score
let plyEarned = 0;           // this run
let hull = 3, maxHull = 3;
let shield = 0;
let combo = 0, comboTimer = 0;
let rage = 0;                // fills when bushes escape past you
const RAGE_MAX = 8;
let quota = 0, spawned = 0, killed = 0;
let spawnTimer = 0, spawnEvery = 1.2;
let tookDamageThisLevel = false;
let banner = null, bannerT = 0;
let shake = 0, flash = 0, hitStop = 0;
let clearT = 0, invuln = 0;
let unlockToast = null, unlockToastT = 0;

let player = null, boss = null;
let bullets = [], foes = [], foeShots = [], bits = [], leaves = [], hedges = [], watchers = [], pickups = [];
let cleanTimer = 12;   // CLEAN-O drops by now and then. do not shoot CLEAN-O.

/* ═══════════════ THE COLD OPEN ═══════════════
   Five beats, then the title slams. Skippable, because you will
   have seen it. Runs off the same synth bed as the game.
   ═════════════════════════════════════════════ */
const CINE = [
  { d:3.4, line:'THE VALLEY WAS CLEAN.',          sub:'for about a week.' },
  { d:3.4, line:'YOU PRUNED EVERY LAST BUSH.',    sub:'they took it personally.' },
  { d:3.4, line:'THEY GREW BACK.',                sub:'taller. angrier. organised.' },
  { d:3.6, line:'AND THIS TIME THEY ARE ARMED.',  sub:'the King is funding them.' },
  { d:3.2, line:'',                               sub:'' },
];
let cineT = 0, cineBeat = 0;

function playIntro(){
  state = 'intro';
  cineT = 0; cineBeat = 0;
  bank = makeBank(save.stall*7919 + 104729 + 13, 1, save.stall);
  nextStepTime = AC ? AC.currentTime + 0.06 : 0;
  musicStep = 0;
  curChord = chordAt(bank, 0).notes;
  leaves = Array.from({length:44}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    z: 0.3 + Math.random()*1.1, a: Math.random()*TAU,
    sp: 12 + Math.random()*40, w: 3 + Math.random()*5,
  }));
  hedges = makeHedges();
}

function updateCine(dt){
  cineT += dt;
  for (const lf of leaves){
    lf.y += lf.sp*lf.z*dt; lf.a += dt*lf.z*1.4;
    lf.x += Math.sin(lf.a)*10*dt;
    if (lf.y > H+14){ lf.y = -14; lf.x = Math.random()*W; }
  }
  for (const hd of hedges) hd.off += dt*9;
  stepBits(dt);
  shake = Math.max(0, shake - dt*34);
  flash = Math.max(0, flash - dt*3.4);

  if (cineT >= CINE[cineBeat].d){
    cineT = 0;
    cineBeat++;
    if (cineBeat >= CINE.length){ startRun(); return; }
    // each cut lands on a chord
    if (cineBeat === 3){ shake = 14; flash = 0.7; sfx.hurt(); }
    else if (cineBeat === CINE.length-1){ shake = 20; flash = 1; sfx.unlock(); }
    else sfx.levelUp();
  }
}

function drawCine(){
  const b = CINE[cineBeat], t = cineT, p = clamp(t / b.d, 0, 1);
  const fade = clamp(t/0.5, 0, 1) * clamp((b.d - t)/0.5, 0, 1);

  drawBackground();
  drawLeaves();

  const cy = 300;
  if (cineBeat === 0){
    // the valley, quiet, the two of you standing in it
    const walk = -120 + p*180;
    sprite(IMG.hero,  W/2 - 130 + walk*0.4, cy + Math.sin(t*3)*4, 150, Math.sin(t*2)*0.05, fade);
    sprite(IMG.clean, W/2 + 150, cy + Math.sin(t*2.4)*4, 138, Math.sin(t*1.8)*0.05, fade, true);
    sprite(IMG.finish, W/2 + 320, cy + 10, 130, 0, fade*0.85);
    sprite(IMG.toilet, W/2 - 330, cy + 30, 90, 0, fade*0.9);
  } else if (cineBeat === 1){
    // the pruning, in flashback
    for (let i=0;i<6;i++){
      const k = (i/6);
      const fallT = clamp((p - k*0.1)*2.2, 0, 1);
      const x = 150 + i*132;
      const y = cy - 60 + fallT*fallT*260;
      sprite(IMG[['bush1','bushT1','bush2','bushT2','bush1','bushT1'][i]],
             x, y, 86, fallT*2.4, fade*(1-fallT*0.85), i%2===1);
      if (fallT > 0.05 && fallT < 0.12 && bits.length < 260) spray(x, y, 4, 110);
    }
    sprite(IMG.hero, W/2, cy + 150, 120, 0, fade);
  } else if (cineBeat === 2){
    // and back they come, one at a time, out of the ground
    for (let i=0;i<6;i++){
      const k = i/6;
      const g = clamp((p - k*0.13)*3.2, 0, 1);
      const eased = 1 - Math.pow(1-g, 3);
      const x = 150 + i*132;
      const y = H + 40 - eased*(H - cy + 20);
      if (g > 0) sprite(IMG[['bush1','bushT1','bush2','bushT2','legion','reaper'][i]],
                        x, y, 40 + eased*54, Math.sin(t*4+i)*0.07, fade, i%2===1);
    }
  } else if (cineBeat === 3){
    // the reveal
    const pop = 1 - Math.pow(1 - clamp(p*2.6, 0, 1), 4);
    sprite(IMG.king, W/2, cy - 30 - pop*10, 90 + pop*250, Math.sin(t*1.4)*0.03, fade*0.9);
    sprite(IMG.bush2, W/2 - 250, cy + 60, 60 + pop*130, Math.sin(t*3)*0.08, fade);
    sprite(IMG.legion, W/2 + 250, cy + 70, 50 + pop*110, Math.sin(t*3.4)*0.08, fade, true);
  } else {
    // title slam
    const pop = 1 - Math.pow(1 - clamp(t*3.2, 0, 1), 5);
    sprite(IMG.logo, W/2, 210, 60 + pop*180, 0, fade);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = fade * clamp((t-0.5)*2, 0, 1);
    ctx.font = 'bold 30px ui-monospace,monospace';
    ctx.fillStyle = '#ffd45e';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 12;
    ctx.fillText(VERSION_NAME, W/2, 350);
    ctx.shadowBlur = 0;
    ctx.restore();
    sprite(IMG.bush2,  W/2 - 210, 470, 118, Math.sin(t*3)*0.08, fade);
    sprite(IMG.player, W/2,       478, 108, Math.sin(t*2.2)*0.05, fade);
    sprite(IMG.bush1,  W/2 + 210, 470, 118, Math.sin(t*3.4)*0.08, fade, true);
  }

  drawBits();

  // the words
  if (b.line){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = fade;
    ctx.fillStyle = 'rgba(3,8,5,.66)';
    ctx.fillRect(0, 96, W, 92);
    ctx.font = 'bold 34px ui-monospace,monospace';
    ctx.fillStyle = '#f2fbec';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 14;
    ctx.fillText(b.line, W/2, 140);
    ctx.shadowBlur = 0;
    ctx.font = '15px ui-monospace,monospace';
    ctx.fillStyle = '#9fbf98';
    ctx.fillText(b.sub, W/2, 170);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  // beat pips + skip hint
  ctx.save();
  ctx.textAlign = 'right';
  ctx.font = '11px ui-monospace,monospace';
  ctx.fillStyle = 'rgba(190,220,180,.5)';
  ctx.fillText('any key to skip', W-16, H-18);
  ctx.restore();
  for (let i=0;i<CINE.length;i++){
    ctx.fillStyle = i <= cineBeat ? '#ffd45e' : 'rgba(255,255,255,.18)';
    ctx.fillRect(16 + i*14, H-22, 9, 3);
  }
  ctx.textAlign = 'left';
}

/* ═══════════════ INPUT ═══════════════ */
const keys = Object.create(null);
let pointer = { x:W/2, y:H-90, active:false };

addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();

  const k = e.key.toLowerCase();
  if (state === 'menu' && (k === ' ' || k === 'enter')) playIntro();
  else if (state === 'intro') startRun();
  else if (state === 'wiped' && (k === ' ' || k === 'enter' || k === 'r')) startRun();
  else if (k === 'p' && (state === 'play' || state === 'pause'))
    state = state === 'play' ? 'pause' : 'play';
  else if (k === 'm'){ save.muted = !save.muted; persist(); applyMute(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function canvasPoint(ev){
  const r = cv.getBoundingClientRect();
  const scale = Math.min(r.width / W, r.height / H);
  const ox = (r.width  - W*scale)/2;
  const oy = (r.height - H*scale)/2;
  return { x:(ev.clientX - r.left - ox)/scale, y:(ev.clientY - r.top - oy)/scale };
}
cv.addEventListener('pointerdown', ev => {
  cv.setPointerCapture(ev.pointerId);
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  const p = canvasPoint(ev);
  pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  if (state === 'menu') playIntro();
  else if (state === 'intro') startRun();
  else if (state === 'wiped') startRun();
});
cv.addEventListener('pointermove', ev => {
  const p = canvasPoint(ev);
  pointer.x = p.x; pointer.y = p.y;
  if (ev.buttons || ev.pointerType === 'mouse') pointer.active = true;
});
cv.addEventListener('pointerup', () => { pointer.active = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ═══════════════ RUN / LEVEL SETUP ═══════════════ */
function startRun(){
  stall = save.stall;
  level = 1; sheets = 0; plyEarned = 0;
  maxHull = 3; hull = maxHull;
  combo = 0; comboTimer = 0; rage = 0;
  player = { x:W/2, y:H-90, r:13, vx:0, vy:0, cd:0 };
  drone = { a:0, cd:0 };
  hedges = makeHedges();
  watchers = makeWatchers();
  seenTypes = new Set(); intro = null; introT = 0;
  state = 'play';
  buildLevel();
}

function buildLevel(){
  dl = level + (stall - 1) * 3;
  bank = makeBank(stall*7919 + level*104729 + 13, level, stall);
  nextStepTime = AC ? AC.currentTime + 0.06 : 0;
  musicStep = 0;
  curChord = chordAt(bank, 0).notes;

  bullets = []; foes = []; foeShots = []; bits = [];
  leaves = Array.from({length:44}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    z: 0.3 + Math.random()*1.1, a: Math.random()*TAU,
    sp: 12 + Math.random()*40, w: 3 + Math.random()*5,
  }));

  boss = null;
  pickups = []; cleanTimer = rand(9, 17);
  spawned = 0; killed = 0; spawnTimer = 0.9;
  tookDamageThisLevel = false;
  invuln = 1.2;
  shield = owns('quilted') ? 1 : 0;

  const isBoss = level % 5 === 0;
  if (isBoss){
    quota = 0;
    spawnBoss();
    showBanner('KING LOG', 'the crown wants a word', '#ff6b5e');
  } else {
    quota = Math.min(78, 16 + Math.round(dl*2.8));
    spawnEvery = Math.max(0.34, 1.35 - dl*0.05);
    showBanner('LEVEL ' + level,
      'new groove · ' + keyName(bank) + ' ' + bank.prog.name + ' · ' + Math.round(bank.tempo) + ' bpm', '#8ef0a8');
  }
  sfx.levelUp();
}

function makeHedges(){
  const arr = [];
  for (let layer=0; layer<2; layer++){
    const pts = [];
    for (let x=-40; x<=W+40; x+=34) pts.push({ x, h: 30 + Math.random()*46 });
    arr.push({ pts, depth: layer, off: 0 });
  }
  return arr;
}

/* eyes in the dark up top — the rest of the hedge, watching you work */
function makeWatchers(){
  return Array.from({length:9}, (_,i) => ({
    x: 50 + (W-100)*(i + rand(-0.3,0.3))/8,
    y: 12 + Math.random()*26,
    s: 0.7 + Math.random()*0.6,
    blink: rand(0.5, 5),
    blinking: 0,
    bob: Math.random()*TAU,
  }));
}

function showBanner(title, sub, color){
  banner = { title, sub, color: color || '#8ef0a8' };
  bannerT = 2.4;
}

/* ═══════════════ SPAWNING ═══════════════ */
function pickBushType(){
  const pool = BUSH_KEYS.filter(k => dl >= BUSHES[k].from);
  // bias toward newer, nastier shrubbery
  const weights = pool.map((k,i) => 1 + i*0.55);
  let total = weights.reduce((a,b)=>a+b,0), roll = Math.random()*total;
  for (let i=0;i<pool.length;i++){ roll -= weights[i]; if (roll <= 0) return pool[i]; }
  return pool[0];
}

function makeBush(type, x, y){
  const d = BUSHES[type];
  const f = {
    type, x, y, r: d.r,
    hp: d.hp + Math.floor(dl/7),
    maxHp: d.hp + Math.floor(dl/7),
    vx: 0, vy: (88 + dl*5) * d.spd * 0.8,
    t: Math.random()*TAU,
    phase: Math.random()*TAU,
    cd: rand(1.0, 2.6),
    blink: rand(1, 4),
    blinking: 0,
    flip: Math.random() < 0.5,
    // no two bushes look alike: each gets its own tint, size and posture
    tint:  VARIANTS[Math.floor(Math.random()*VARIANTS.length)],
    scaleV: rand(0.86, 1.16),
    elite: false,
    // rank-and-file shrubs stay quiet early — the first levels are about
    // learning to read the swarm, not eating berries from twenty directions
    shooter: type !== 'bush' ? true : (dl >= 3 && Math.random() < 0.45),
    wob: rand(0.8, 1.6),
    hurtT: 0,
    homeY: 70 + Math.random()*90,
  };
  // one in fifteen or so is ROTTEN: bigger, tougher, glowing, worth the trouble
  if (dl >= 3 && Math.random() < 0.055 + dl*0.003){
    f.elite = true;
    f.hp = f.maxHp = Math.ceil(f.maxHp * 2.5) + 1;
    f.scaleV *= 1.3;
    f.r = Math.round(f.r * 1.22);
    f.vy *= 0.82;
    f.shooter = true;
  }
  return f;
}

function spawnFormation(){
  const type = pickBushType();
  if (!seenTypes.has(type)){
    seenTypes.add(type);
    intro = { type, t: 0 };
    introT = 3.4;
    rustle(0.6, 300, 0.22, 0.9, 900);
  }
  const n = clamp(3 + Math.floor(dl/3), 3, 7);
  const pattern = Math.floor(Math.random()*3);
  for (let i=0;i<n && spawned<quota;i++){
    let x, y;
    if (pattern === 0){ x = 90 + (W-180)*(i+0.5)/n; y = -30 - i*8; }
    else if (pattern === 1){ x = rand(70, W-70); y = -30 - i*46; }
    else { const cx = rand(160, W-160); x = cx + (i-(n-1)/2)*46; y = -30 - Math.abs(i-(n-1)/2)*30; }
    foes.push(makeBush(type, clamp(x, 40, W-40), y));
    spawned++;
  }
}

function spawnBoss(){
  boss = {
    x: W/2, y: -140, r: 98,
    hp: 34 + dl*11, maxHp: 34 + dl*11,
    t: 0, cd: 2.2, mode: 0, hurtT: 0, entering: true, blinking: 0, blink: 2,
  };
}

/* ═══════════════ UPDATE ═══════════════ */
let last = performance.now();
function frame(now){
  let dt = (now - last)/1000; last = now;
  dt = Math.min(dt, 1/30);
  if (hitStop > 0){ hitStop -= dt; dt *= 0.25; }
  scheduleMusic();
  if (state === 'play' || state === 'clear') update(dt);
  else if (state === 'intro') updateCine(dt);
  render(dt);
  requestAnimationFrame(frame);
}

function update(dt){
  bannerT = Math.max(0, bannerT - dt);
  unlockToastT = Math.max(0, unlockToastT - dt);
  if (introT > 0){ introT -= dt; if (intro) intro.t += dt; }
  shake = Math.max(0, shake - dt*34);
  flash = Math.max(0, flash - dt*3.4);
  invuln = Math.max(0, invuln - dt);

  for (const lf of leaves){
    lf.y += lf.sp*lf.z*dt; lf.a += dt*lf.z*1.4;
    lf.x += Math.sin(lf.a)*10*dt;
    if (lf.y > H+14){ lf.y = -14; lf.x = Math.random()*W; }
  }
  for (const hd of hedges) hd.off += dt * (hd.depth === 0 ? 9 : 20);
  for (const w of watchers){
    w.bob += dt*1.3;
    w.blink -= dt;
    if (w.blink <= 0){ w.blinking = 0.12; w.blink = rand(1.2, 5.5); }
    w.blinking = Math.max(0, w.blinking - dt);
  }

  if (state === 'clear'){
    clearT -= dt;
    stepBits(dt);
    if (clearT <= 0){ level++; buildLevel(); state = 'play'; }
    return;
  }

  updatePlayer(dt);
  updateBullets(dt);
  updatePickups(dt);
  updateFoes(dt);
  updateBoss(dt);
  updateFoeShots(dt);
  stepBits(dt);

  if (comboTimer > 0){
    comboTimer -= dt;
    if (comboTimer <= 0) combo = 0;
  }

  // spawning
  if (!boss && spawned < quota){
    spawnTimer -= dt;
    if (spawnTimer <= 0){ spawnFormation(); spawnTimer = spawnEvery; }
  }
  // level complete
  if (!boss && spawned >= quota && foes.length === 0 && state === 'play') finishLevel();
}

function updatePlayer(dt){
  const p = player;
  const focus = keys['shift'];
  const speed = (focus ? 210 : 430);
  let ax = 0, ay = 0;
  if (keys['arrowleft'] || keys['a']) ax -= 1;
  if (keys['arrowright']|| keys['d']) ax += 1;
  if (keys['arrowup']   || keys['w']) ay -= 1;
  if (keys['arrowdown'] || keys['s']) ay += 1;

  if (ax || ay){
    const m = Math.hypot(ax,ay) || 1;
    p.x += ax/m*speed*dt; p.y += ay/m*speed*dt;
    pointer.active = false;
  } else if (pointer.active){
    p.x += (pointer.x - p.x) * Math.min(1, dt*14);
    p.y += (pointer.y - p.y) * Math.min(1, dt*14);
  }
  p.x = clamp(p.x, 24, W-24);
  p.y = clamp(p.y, 60, H-26);

  // auto-fire — your hands are full
  p.cd -= dt;
  const rate = owns('bidet') ? 0.098 : 0.155;
  if (p.cd <= 0){ fire(); p.cd = rate; }

  if (owns('wetwipe')){
    drone.a += dt*2.3;
    drone.cd -= dt;
    if (drone.cd <= 0){
      const dx = p.x + Math.cos(drone.a)*46, dy = p.y + Math.sin(drone.a)*46;
      bullets.push({ x:dx, y:dy, vx:0, vy:-660, r:4, dmg:1, rot:Math.random()*TAU, wipe:false });
      drone.cd = 0.34;
    }
  }
}

function fire(){
  const p = player;
  const shots = [];
  if (owns('double')){ shots.push([-8,0],[8,0]); } else { shots.push([0,0]); }
  if (owns('aloe')){ shots.push([-14,-0.34],[14,0.34]); }
  for (const [ox, ang] of shots){
    const a = ang || 0;
    bullets.push({
      x: p.x + ox, y: p.y - 16,
      vx: Math.sin(a)*720, vy: -Math.cos(a)*720,
      r: 5, dmg: 1, rot: Math.random()*TAU, wipe: true,
    });
  }
  sfx.shoot();
}

function updateBullets(dt){
  for (let i=bullets.length-1; i>=0; i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.rot += dt*9;
    if (b.y < -20 || b.x < -20 || b.x > W+20){ bullets.splice(i,1); continue; }

    let gone = false;
    for (let j=foes.length-1; j>=0; j--){
      const f = foes[j];
      if (Math.hypot(f.x-b.x, f.y-b.y) < f.r + b.r){
        damageFoe(f, b.dmg, j);
        bullets.splice(i,1); gone = true; break;
      }
    }
    if (gone) continue;

    if (boss && !boss.entering && Math.hypot(boss.x-b.x, boss.y-b.y) < boss.r + b.r){
      boss.hp -= b.dmg; boss.hurtT = 0.09;
      sfx.hit();
      spray(b.x, b.y, 3, bank.leafHue);
      bullets.splice(i,1);
      if (boss.hp <= 0) killBoss();
    }
  }
}

function damageFoe(f, dmg, idx){
  f.hp -= dmg; f.hurtT = 0.1;
  spray(f.x, f.y, 3, bank.leafHue);
  if (f.hp <= 0){
    const d = BUSHES[f.type];
    combo++; comboTimer = 2.6;
    const mult = comboMult();
    const bonus = f.elite ? 4 : 1;
    sheets += d.sheets * mult * bonus;
    addPly(d.ply * bonus);
    if (f.elite){ shake = Math.max(shake, 10); flash = Math.max(flash, 0.35); }
    killed++;
    spray(f.x, f.y, 16, bank.leafHue, true);
    sfx.bushDie();
    shake = Math.max(shake, 4);
    if (f.type === 'legion'){ // splits into two furious children
      for (let k=0;k<2;k++){
        const kid = makeBush('bush', f.x + (k?26:-26), f.y);
        kid.vy *= 1.3;
        foes.push(kid);
      }
    }
    foes.splice(idx,1);
  } else {
    sfx.hit();
  }
}

const comboMult = () => clamp(1 + Math.floor(combo/5), 1, 8);

function addPly(n){
  const before = save.ply;
  plyEarned += n; save.ply += n;
  const u = UNLOCKS.find(u => before < u.ply && save.ply >= u.ply);
  if (u){
    unlockToast = u; unlockToastT = 4.2;
    sfx.unlock();
    flash = Math.max(flash, 0.5);
  }
}

function updateFoes(dt){
  for (let i=foes.length-1; i>=0; i--){
    const f = foes[i];
    f.t += dt; f.hurtT = Math.max(0, f.hurtT - dt);
    f.blink -= dt;
    if (f.blink <= 0){ f.blinking = 0.11; f.blink = rand(1.6, 5); }
    f.blinking = Math.max(0, f.blinking - dt);

    // they shed as they come. the whole screen should be leaves.
    f.shed = (f.shed || 0) - dt;
    if (f.shed <= 0 && f.y > -20){
      f.shed = 0.26;
      bits.push({
        x: f.x + rand(-f.r, f.r), y: f.y + rand(-f.r*0.5, f.r*0.7),
        vx: rand(-18,18), vy: rand(-6,26),
        life: rand(0.6,1.1), max: 1.1, r: rand(2,4),
        rot: Math.random()*TAU, vr: rand(-4,4),
        hue: (bank.leafHue + rand(-18,18) + 360) % 360,
      });
    }

    const spd = 1 + dl*0.035;
    switch (f.type){
      case 'bush':
        f.y += f.vy*dt;
        f.x += Math.sin(f.t*1.1 + f.phase) * 22*dt;
        break;
      case 'scout':
        f.y += f.vy*0.8*dt;
        f.x += Math.sin(f.t*2.6 + f.phase) * 150*dt*spd;
        break;
      case 'armed':
        if (f.y < f.homeY){ f.y += f.vy*dt; }
        else {
          const a = Math.atan2(player.y-f.y, player.x-f.x);
          f.x += Math.cos(a)*(150+dl*6)*dt;
          f.y += Math.sin(a)*(150+dl*6)*dt;
        }
        break;
      case 'gunner':
        if (f.y < f.homeY) f.y += f.vy*dt;
        else f.x += Math.sin(f.t*0.9 + f.phase)*70*dt;
        break;
      case 'legion':
        f.y += f.vy*0.7*dt;
        f.x += Math.cos(f.t*0.7 + f.phase)*40*dt;
        break;
      case 'reaper': {
        if (f.y < f.homeY) f.y += f.vy*dt;
        else { f.x += Math.cos(f.t*1.5)*110*dt; f.y += Math.sin(f.t*1.5)*70*dt; }
        break;
      }
    }
    f.x = clamp(f.x, f.r, W-f.r);

    // shooting bushes
    if (f.y > 0 && f.shooter && (f.type === 'gunner' || f.type === 'reaper' || f.type === 'bush' || f.type === 'legion')){
      f.cd -= dt;
      if (f.cd <= 0){
        const base = f.type === 'gunner' ? 1.05 : f.type === 'reaper' ? 1.5 : 2.6;
        f.cd = Math.max(0.42, base - dl*0.03) * rand(0.8,1.25);
        if (f.type === 'reaper'){
          for (let k=0;k<5;k++){
            const a = f.t*2 + k*TAU/5;
            foeShots.push(berry(f.x, f.y, Math.cos(a), Math.sin(a)));
          }
        } else if (f.type === 'gunner'){
          const a = Math.atan2(player.y-f.y, player.x-f.x);
          for (let k=-1;k<=1;k++) foeShots.push(berry(f.x, f.y, Math.cos(a+k*0.18), Math.sin(a+k*0.18)));
        } else if (Math.random() < 0.7){
          const a = Math.atan2(player.y-f.y, player.x-f.x);
          foeShots.push(berry(f.x, f.y, Math.cos(a), Math.sin(a)));
        }
        rustle(0.08, bank.rustleTone*0.8, 0.07, 2, null);
      }
    }

    // collision with player
    if (invuln <= 0 && Math.hypot(f.x-player.x, f.y-player.y) < f.r*0.62 + player.r*0.5){
      hurtPlayer();
      spray(f.x, f.y, 14, bank.leafHue, true);
      foes.splice(i,1);
      continue;
    }

    // escaped past you → the hedge gets angrier
    if (f.y > H + 40){
      foes.splice(i,1);
      combo = 0;
      rage++;
      sfx.rageUp();
      if (rage >= RAGE_MAX){ rage = 0; hurtPlayer(true); }
    }
  }
}

/* CLEAN-O — the one bush in the whole valley with manners.
   Fly into him for a reward. Shoot him and he leaves, and you deserve that. */
function updatePickups(dt){
  cleanTimer -= dt;
  if (cleanTimer <= 0 && pickups.length === 0 && state === 'play'){
    cleanTimer = rand(20, 32);
    const fromLeft = Math.random() < 0.5;
    pickups.push({
      x: fromLeft ? -60 : W+60, y: rand(150, H-190),
      vx: (fromLeft ? 1 : -1) * rand(85, 120),
      t: 0, r: 30, flip: !fromLeft, spooked: false,
    });
    blip(660, 0.5, 'sine', 0.1, 990);
  }
  for (let i=pickups.length-1;i>=0;i--){
    const c = pickups[i];
    c.t += dt;
    c.x += c.vx*dt;
    c.y += Math.sin(c.t*2.1)*22*dt;
    if (c.spooked) c.y -= 150*dt;
    if (c.x < -110 || c.x > W+110 || c.y < -110){ pickups.splice(i,1); continue; }

    if (!c.spooked){
      // you shot the nice bush
      for (let j=bullets.length-1;j>=0;j--){
        const b = bullets[j];
        if (Math.hypot(b.x-c.x, b.y-c.y) < c.r + b.r){
          bullets.splice(j,1);
          c.spooked = true; c.vx *= 2.4;
          combo = 0; comboTimer = 0;
          showBanner('YOU SHOT CLEAN-O', 'he was holding a towel for you', '#ff9d6b');
          rustle(0.5, 700, 0.2, 1.2, 200);
          break;
        }
      }
      // or you collected him properly
      if (Math.hypot(c.x-player.x, c.y-player.y) < c.r + player.r*1.2){
        pickups.splice(i,1);
        addPly(35);
        sheets += 300 * comboMult();
        if (hull < maxHull){ hull++; }
        showBanner('CLEAN-O', '+35 ply · he tidied you up', '#8ef0a8');
        spray(c.x, c.y, 26, 150, true);
        sfx.unlock();
      }
    }
  }
}

function drawPickups(){
  for (const c of pickups){
    const bob = Math.sin(c.t*3)*4;
    if (!c.spooked){
      ctx.save();
      ctx.globalAlpha = 0.25 + 0.12*Math.sin(c.t*5);
      ctx.fillStyle = '#bdf5c4';
      ctx.beginPath(); ctx.arc(c.x, c.y+bob, c.r*1.5, 0, TAU); ctx.fill();
      ctx.restore();
    }
    sprite(IMG.clean, c.x, c.y + bob, 74, Math.sin(c.t*2)*0.09, null, c.flip);
  }
}

function berry(x,y,dx,dy){
  const sp = 165 + dl*7;
  return { x, y, vx:dx*sp, vy:dy*sp, r:6, t:0 };
}

function updateFoeShots(dt){
  for (let i=foeShots.length-1;i>=0;i--){
    const s = foeShots[i];
    s.x += s.vx*dt; s.y += s.vy*dt; s.t += dt;
    if (s.y > H+20 || s.y < -20 || s.x < -20 || s.x > W+20){ foeShots.splice(i,1); continue; }
    if (invuln <= 0 && Math.hypot(s.x-player.x, s.y-player.y) < s.r + player.r*0.7){
      foeShots.splice(i,1);
      hurtPlayer();
    }
  }
}

function updateBoss(dt){
  if (!boss) return;
  const b = boss;
  b.t += dt; b.hurtT = Math.max(0, b.hurtT - dt);
  b.blink -= dt;
  if (b.blink <= 0){ b.blinking = 0.13; b.blink = rand(1.4, 3.6); }
  b.blinking = Math.max(0, b.blinking - dt);

  if (b.entering){
    b.y += 70*dt;
    if (b.y >= 130){ b.y = 130; b.entering = false; }
    return;
  }
  const hpr = b.hp / b.maxHp;
  const sway = hpr < 0.4 ? 1.7 : hpr < 0.75 ? 1.25 : 1;
  b.x = W/2 + Math.sin(b.t*0.62*sway) * (W/2 - 130);
  b.y = 130 + Math.sin(b.t*0.9)*16;

  b.cd -= dt;
  if (b.cd <= 0){
    b.mode = (b.mode + 1) % 3;
    b.cd = Math.max(0.85, (1.85 - dl*0.02)) / sway;
    if (b.mode === 0){
      const n = 10 + Math.floor(dl/3);
      for (let k=0;k<n;k++){
        const a = Math.PI*0.15 + (Math.PI*0.7)*(k/(n-1));
        foeShots.push(berry(b.x, b.y+40, Math.cos(a), Math.sin(a)));
      }
    } else if (b.mode === 1){
      const a = Math.atan2(player.y-b.y, player.x-b.x);
      for (let k=-2;k<=2;k++) foeShots.push(berry(b.x, b.y+40, Math.cos(a+k*0.13), Math.sin(a+k*0.13)));
    } else {
      for (let k=0;k<2;k++){
        const f = makeBush(dl >= 4 ? 'armed' : 'bush', b.x + (k?70:-70), b.y+30);
        foes.push(f);
      }
    }
    rustle(0.22, 380, 0.2, 1.1, 140);
  }

  if (invuln <= 0 && Math.hypot(b.x-player.x, b.y-player.y) < b.r*0.62 + player.r*0.6) hurtPlayer();
}

function killBoss(){
  spray(boss.x, boss.y, 70, bank.leafHue, true);
  sfx.bossDie();
  shake = 22; flash = 1; hitStop = 0.22;
  sheets += 500 * comboMult();
  addPly(60);
  maxHull++; hull = Math.min(maxHull, hull+1);
  boss = null;
  finishLevel(true);
}

function finishLevel(wasBoss){
  const bonus = 12 + dl*3 + (tookDamageThisLevel ? 0 : 18);
  addPly(bonus);
  sheets += (tookDamageThisLevel ? 100 : 250);
  showBanner(wasBoss ? 'KING LOG DETHRONED' : 'LEVEL ' + level + ' CLEAR',
    (tookDamageThisLevel ? '+' + bonus + ' ply' : 'SPOTLESS · +' + bonus + ' ply'),
    '#ffe58a');
  state = 'clear'; clearT = 2.3;
  save.bestLevel = Math.max(save.bestLevel, level);
  persist();
}

function hurtPlayer(fromRage){
  if (invuln > 0) return;
  if (shield > 0 && !fromRage){
    shield = 0; invuln = 1.0;
    blip(520, 0.3, 'triangle', 0.2, 180);
    shake = 8;
    return;
  }
  hull--; tookDamageThisLevel = true;
  combo = 0; comboTimer = 0;
  invuln = 1.6; shake = 16; flash = 0.8; hitStop = 0.12;
  sfx.hurt();
  spray(player.x, player.y, 22, 40, true);
  if (hull <= 0) wipeOut();
}

/* the wipe — this is the whole point of the game */
function wipeOut(){
  state = 'wiped';
  save.runs++;
  save.stall++;                       // next run: brand-new sounds, angrier hedge
  save.bestSheets = Math.max(save.bestSheets, sheets);
  save.bestLevel  = Math.max(save.bestLevel, level);
  persist();
  shake = 26; flash = 1;
  sfx.hurt();
}

/* ═══════════════ PARTICLES ═══════════════ */
function spray(x, y, n, hue, big){
  for (let i=0;i<n;i++){
    const a = Math.random()*TAU, s = rand(40, big?300:170);
    bits.push({
      x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life: rand(0.35, 0.95), max: 0.95,
      r: rand(2, big?7:4), rot: Math.random()*TAU, vr: rand(-9,9),
      hue: (hue + rand(-22,22) + 360) % 360,
    });
  }
}
function stepBits(dt){
  for (let i=bits.length-1;i>=0;i--){
    const p = bits[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 220*dt; p.vx *= 0.97;
    p.rot += p.vr*dt;
    p.life -= dt;
    if (p.life <= 0) bits.splice(i,1);
  }
}

/* ═══════════════ RENDER ═══════════════ */
function render(dt){
  if (!artReady()){ drawLoading(); return; }
  if (state === 'intro'){
    ctx.save();
    if (shake > 0.2) ctx.translate(rand(-shake,shake)*0.5, rand(-shake,shake)*0.5);
    drawCine();
    ctx.restore();
    if (flash > 0.01){
      ctx.fillStyle = 'rgba(255,240,225,' + (flash*0.32) + ')';
      ctx.fillRect(0,0,W,H);
    }
    return;
  }
  ctx.save();
  if (shake > 0.2) ctx.translate(rand(-shake,shake)*0.5, rand(-shake,shake)*0.5);

  drawBackground();

  if (state !== 'menu'){
    drawLeaves();
    drawPickups();
    for (const f of foes) drawBush(f);
    if (boss) drawBossBush(boss);
    drawFoeShots();
    drawBullets();
    drawBits();
    if (player && state !== 'wiped') drawPlayer();
    else if (player && state === 'wiped') drawBits();
    drawHUD();
  }

  ctx.restore();

  if (flash > 0.01){
    ctx.fillStyle = 'rgba(255,240,225,' + (flash*0.32) + ')';
    ctx.fillRect(0,0,W,H);
  }

  if (state === 'menu')  drawMenu();
  if (state === 'wiped') drawWipeScreen();
  if (state === 'pause') drawPause();
  if (bannerT > 0 && (state === 'play' || state === 'clear')) drawBanner();
  if (introT > 0 && intro && state === 'play') drawIntroCard();
  if (unlockToastT > 0) drawUnlockToast();
}

/* the castle scene from the original game, slowly drifting, tinted to the
   level's palette and dimmed enough that white sheets still read against it */
function drawBackground(){
  const h = bank ? bank.hue : 130;
  const im = boss ? IMG.bgBoss : (level % 2 ? IMG.bg : IMG.bg2);

  if (ok(im)){
    const scale = Math.max(W / im.naturalWidth, (H*1.14) / im.naturalHeight);
    const dw = im.naturalWidth*scale, dh = im.naturalHeight*scale;
    const drift = hedges.length ? (hedges[0].off * 0.6) % 60 - 30 : 0;
    ctx.drawImage(im, W/2 - dw/2 + drift, H/2 - dh/2 - 10, dw, dh);
  } else {
    ctx.fillStyle = 'hsl(' + h + ' 42% 7%)'; ctx.fillRect(0,0,W,H);
  }

  // dusk wash — keeps the sprites and HUD legible over a bright daytime scene
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'hsl(' + h + ' 55% 42%)';
  ctx.fillRect(0,0,W,H);
  ctx.restore();
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,   'rgba(2,8,4,.72)');
  g.addColorStop(0.4, 'rgba(2,8,4,.38)');
  g.addColorStop(1,   'rgba(2,8,4,.66)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // foreground hedge silhouettes, still hand-drawn — they scroll, the art can't
  const lh = bank ? bank.leafHue : 110;
  for (const hd of hedges){
    const depth = hd.depth;
    const base = H - (depth === 0 ? 6 : 60);
    ctx.fillStyle = 'hsl(' + lh + ' ' + (30 - depth*10) + '% ' + (depth===0?7:5) + '%)';
    ctx.beginPath();
    ctx.moveTo(-40, H);
    for (const pt of hd.pts){
      const y = base - pt.h - Math.sin((pt.x + hd.off)*0.02)*8;
      ctx.lineTo(pt.x, y);
    }
    ctx.lineTo(W+40, H);
    ctx.closePath(); ctx.fill();
  }
}

/* the rest of the hedge, up in the dark, watching you work */
function drawWatchers(){
  const lh = bank.leafHue;
  ctx.save();
  const g = ctx.createLinearGradient(0,0,0,86);
  g.addColorStop(0, 'hsl(' + lh + ' 30% 8%)');
  g.addColorStop(1, 'hsla(' + lh + ',30%,8%,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,86);

  for (const w of watchers){
    const y = w.y + Math.sin(w.bob)*2.5;
    const s = w.s;
    const look = clamp((player ? (player.x - w.x)/W : 0) * 2.2, -1, 1);
    ctx.save();
    ctx.translate(w.x, y);
    if (w.blinking > 0){
      ctx.strokeStyle = 'hsl(' + lh + ' 40% 26%)';
      ctx.lineWidth = 2*s;
      ctx.beginPath();
      ctx.moveTo(-9*s, 0); ctx.lineTo(-3*s, 0);
      ctx.moveTo( 3*s, 0); ctx.lineTo( 9*s, 0);
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(226,247,214,.55)';
      ctx.beginPath(); ctx.ellipse(-6*s, 0, 4*s, 3.2*s, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse( 6*s, 0, 4*s, 3.2*s, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#0d1509';
      ctx.beginPath(); ctx.arc(-6*s + look*1.6*s, 0.4*s, 1.9*s, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc( 6*s + look*1.6*s, 0.4*s, 1.9*s, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = 'hsl(' + lh + ' 35% 18%)';
    ctx.lineWidth = 2.4*s; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-11*s, -6*s); ctx.lineTo(-2*s, -3*s);
    ctx.moveTo( 11*s, -6*s); ctx.lineTo( 2*s, -3*s);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* every species gets a proper introduction the first time it turns up */
function drawIntroCard(){
  const a = clamp(introT/0.5, 0, 1) * clamp((3.4-introT)/0.3, 0, 1);
  const d = BUSHES[intro.type];
  const cw = 430, cx = W/2 - cw/2, cy = 92;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(6,14,8,.88)';
  ctx.beginPath(); ctx.roundRect(cx, cy, cw, 96, 12); ctx.fill();
  ctx.strokeStyle = 'hsl(' + bank.leafHue + ' 50% 40%)';
  ctx.lineWidth = 1.5; ctx.stroke();

  // live portrait, glaring right out of the card
  drawBush({
    type: intro.type, x: cx + 60, y: cy + 48, r: 30,
    t: intro.t*1.4, phase: 0.6, wob: 1, blinking: 0, hurtT: 0,
  });

  ctx.textAlign = 'left';
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = '#8fb388';
  ctx.fillText('NEW SPECIES', cx + 112, cy + 30);
  ctx.font = 'bold 21px ui-monospace,monospace';
  ctx.fillStyle = '#ffd45e';
  ctx.fillText(d.name, cx + 112, cy + 54);
  ctx.font = '12px ui-monospace,monospace';
  ctx.fillStyle = '#cfe8c6';
  ctx.fillText(d.taunt, cx + 112, cy + 76);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawLeaves(){
  const lh = bank.leafHue;
  for (const lf of leaves){
    ctx.save();
    ctx.translate(lf.x, lf.y); ctx.rotate(lf.a);
    ctx.globalAlpha = 0.10 + lf.z*0.16;
    ctx.fillStyle = 'hsl(' + lh + ' 55% 45%)';
    ctx.beginPath();
    ctx.ellipse(0, 0, lf.w*lf.z, lf.w*lf.z*0.45, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ── the star of the show ── */
function drawBush(f){
  const d = BUSHES[f.type];
  const wob = Math.sin(f.t*5*f.wob)*0.07;
  const bobY = Math.sin(f.t*3.4 + f.phase)*2;
  const sv = f.scaleV || 1;
  const h = d.h * sv * (1 + 0.03*Math.sin(f.t*6 + f.phase));

  // squashed shadow so they sit in the scene instead of floating over it
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(f.x, f.y + d.h*0.42, f.r*0.8, f.r*0.22, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  if (f.elite){
    ctx.save();
    ctx.globalAlpha = 0.22 + 0.10*Math.sin(f.t*6);
    ctx.fillStyle = '#ff7a5e';
    ctx.beginPath(); ctx.arc(f.x, f.y + bobY, f.r*1.5, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.filter = f.hurtT > 0 ? 'brightness(2.4) saturate(0.5)'
                           : (f.elite ? ELITE.f : (f.tint ? f.tint.f : 'none'));
  sprite(IMG[d.art], f.x, f.y + bobY, h, wob, null, f.flip);
  ctx.filter = 'none';
}

function drawBossBush(b){
  const hpr = b.hp / b.maxHp;
  const wob = Math.sin(b.t*2)*0.04;

  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(b.x, b.y + b.r*0.98, b.r*0.85, b.r*0.2, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  if (b.hurtT > 0) ctx.filter = 'brightness(2.2) saturate(0.5)';
  sprite(IMG.king, b.x, b.y + Math.sin(b.t*1.6)*4, b.r*2.5, wob);
  ctx.filter = 'none';

  // hp bar
  const bw = 460, bx = (W-bw)/2, by = 26;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx-2, by-2, bw+4, 14);
  ctx.fillStyle = hpr > 0.4 ? '#7ee08a' : '#ff6b5e';
  ctx.fillRect(bx, by, bw*clamp(hpr,0,1), 10);
  ctx.font = 'bold 12px ui-monospace,monospace';
  ctx.fillStyle = '#ffd45e'; ctx.textAlign = 'center';
  ctx.fillText('KING LOG', W/2, by + 27);
  ctx.textAlign = 'left';
}

function drawBullets(){
  for (const b of bullets){
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.rot);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#cfe9ff'; ctx.shadowBlur = 8;
    ctx.fillRect(-b.r, -b.r, b.r*2, b.r*2);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(120,150,170,.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-b.r,0); ctx.lineTo(b.r,0);
    ctx.moveTo(0,-b.r); ctx.lineTo(0,b.r); ctx.stroke();
    ctx.restore();
  }
}

function drawFoeShots(){
  ctx.save();
  ctx.shadowColor = '#ff8b6a'; ctx.shadowBlur = 10;
  for (const s of foeShots){
    ctx.fillStyle = '#e8503f';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,190,.85)';
    ctx.beginPath(); ctx.arc(s.x - s.r*0.3, s.y - s.r*0.3, s.r*0.32, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawBits(){
  for (const p of bits){
    const a = clamp(p.life/p.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = 'hsl(' + p.hue + ' 60% ' + (40 + a*20) + '%)';
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r, p.r*0.5, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawPlayer(){
  const p = player;
  const blink = invuln > 0 && Math.floor(invuln*14) % 2 === 0;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.globalAlpha = blink ? 0.35 : 1;

  if (shield > 0){
    ctx.strokeStyle = 'rgba(150,225,255,.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0, p.r*2.1, 0, TAU); ctx.stroke();
  }
  if (owns('wetwipe')){
    const dx = Math.cos(drone.a)*46, dy = Math.sin(drone.a)*46;
    ctx.fillStyle = '#bfe8ff';
    ctx.shadowColor = '#bfe8ff'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(dx, dy, 6, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ground shadow
  ctx.save();
  ctx.globalAlpha *= 0.25;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 34, 20, 5.5, 0, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.restore();

  // the hero himself — full unlock ladder swaps him for the caped version
  const alpha = blink ? 0.35 : 1;
  const bobY = Math.sin(performance.now()/220)*2;
  const lean = clamp((p.x - (pointer.active ? pointer.x : p.x)) * -0.004, -0.16, 0.16);
  sprite(owns('bidet') ? IMG.caped : IMG.player, p.x, p.y + bobY, 68, lean, alpha);
  ctx.globalAlpha = 1;
}

/* ═══════════════ HUD ═══════════════ */
function drawHUD(){
  ctx.save();
  ctx.font = '13px ui-monospace,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#dff3d6';
  ctx.fillText('SHEETS ' + sheets.toLocaleString(), 16, 26);
  ctx.fillStyle = '#9fbf98';
  ctx.fillText('STALL ' + stall + '  ·  LEVEL ' + level + '  ·  PLY ' + save.ply, 16, 46);

  // hull — one golden toilet per life
  for (let i=0;i<maxHull;i++){
    sprite(IMG.toilet, 24 + i*24, 68, 26, 0, i < hull ? 1 : 0.22);
  }
  ctx.globalAlpha = 1;

  // combo
  if (combo > 0){
    const m = comboMult();
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px ui-monospace,monospace';
    ctx.fillStyle = m >= 5 ? '#ffd45e' : '#b9e8a4';
    ctx.globalAlpha = clamp(comboTimer/2.6, 0.25, 1);
    ctx.fillText('x' + m, W/2, 40);
    ctx.font = '11px ui-monospace,monospace';
    ctx.fillText(combo + ' BUSHES', W/2, 56);
    ctx.globalAlpha = 1;
  }

  // rage meter — bushes that slip past you fill this
  const rw = 150, rx = W - rw - 16, ry = 22;
  ctx.textAlign = 'right';
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = '#9fbf98';
  ctx.fillText('HEDGE RAGE', W-16, ry - 6);
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  ctx.fillRect(rx, ry, rw, 8);
  ctx.fillStyle = rage >= RAGE_MAX-2 ? '#ff6b5e' : '#e0a94a';
  ctx.fillRect(rx, ry, rw*(rage/RAGE_MAX), 8);

  // level progress
  if (!boss){
    const pw = 150, px = W - pw - 16, py = 46;
    ctx.fillStyle = '#9fbf98';
    ctx.fillText('LEVEL CLEAR', W-16, py - 4);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(px, py, pw, 6);
    ctx.fillStyle = '#7ee08a';
    ctx.fillRect(px, py, pw*clamp(killed/Math.max(1,quota),0,1), 6);
  }

  // next unlock — the carrot
  const nu = nextUnlock();
  if (nu){
    const prev = UNLOCKS[UNLOCKS.indexOf(nu)-1];
    const from = prev ? prev.ply : 0;
    const prog = clamp((save.ply - from)/(nu.ply - from), 0, 1);
    const bw = 190, bx = W - bw - 16, by = H - 26;
    ctx.textAlign = 'right';
    ctx.font = '10px ui-monospace,monospace';
    ctx.fillStyle = '#9fbf98';
    ctx.fillText('NEXT: ' + nu.name + '  ' + (nu.ply - save.ply) + ' PLY', W-16, by - 6);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(bx, by, bw, 6);
    ctx.fillStyle = '#ffd45e';
    ctx.fillRect(bx, by, bw*prog, 6);
  }
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawBanner(){
  const a = clamp(bannerT/0.6, 0, 1) * clamp((2.4-bannerT)/0.3, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  // level-clear gets the finish tile and a victorious hero
  if (state === 'clear'){
    sprite(IMG.finish, W/2 - 150, H/2 + 6, 130, 0, a*0.95);
    sprite(IMG.hero,   W/2 + 155, H/2 + 6, 130, Math.sin(performance.now()/240)*0.06, a);
  }
  ctx.font = 'bold 40px ui-monospace,monospace';
  ctx.fillStyle = banner.color;
  ctx.shadowColor = banner.color; ctx.shadowBlur = 22;
  ctx.fillText(banner.title, W/2, H/2 - 8);
  ctx.shadowBlur = 0;
  ctx.font = '14px ui-monospace,monospace';
  ctx.fillStyle = '#cfe8c6';
  ctx.fillText(banner.sub, W/2, H/2 + 22);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawUnlockToast(){
  const a = clamp(unlockToastT/0.6, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(10,20,12,.9)';
  ctx.beginPath(); ctx.roundRect(W/2-210, H-136, 420, 62, 10); ctx.fill();
  ctx.strokeStyle = '#ffd45e'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.font = 'bold 17px ui-monospace,monospace';
  ctx.fillStyle = '#ffd45e';
  ctx.fillText('UNLOCKED — ' + unlockToast.name, W/2, H-108);
  ctx.font = '12px ui-monospace,monospace';
  ctx.fillStyle = '#cfe8c6';
  ctx.fillText(unlockToast.desc, W/2, H-88);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawLoading(){
  ctx.fillStyle = '#050a07'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 15px ui-monospace,monospace';
  ctx.fillStyle = '#8ef0a8';
  ctx.fillText('US NEED WIPE', W/2, H/2 - 34);
  ctx.font = '12px ui-monospace,monospace';
  ctx.fillStyle = '#6f8a6a';
  ctx.fillText('unrolling the bushes…  ' + artLoaded + '/' + artTotal, W/2, H/2 - 12);
  const bw = 260, bx = W/2 - bw/2, by = H/2 + 6;
  ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(bx, by, bw, 6);
  ctx.fillStyle = '#ffd45e'; ctx.fillRect(bx, by, bw*(artLoaded/artTotal), 6);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawPanel(){
  ctx.fillStyle = 'rgba(4,10,6,.82)';
  ctx.fillRect(0,0,W,H);
}

function drawMenu(){
  drawPanel();
  ctx.save();
  ctx.textAlign = 'center';

  const t = performance.now()/1000;

  // the real title card
  if (ok(IMG.logo)) sprite(IMG.logo, W/2, 88, 148);
  else {
    ctx.font = 'bold 58px ui-monospace,monospace';
    ctx.fillStyle = '#8ef0a8';
    ctx.fillText(TITLE, W/2, 100);
  }

  ctx.font = 'bold 20px ui-monospace,monospace';
  ctx.fillStyle = '#ffd45e';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
  ctx.fillText(VERSION_NAME, W/2, 178);
  ctx.shadowBlur = 0;
  ctx.font = '12px ui-monospace,monospace';
  ctx.fillStyle = '#cfe8c6';
  ctx.fillText(VERSION + ' · they were pruned. they grew back. they are armed now.', W/2, 198);

  // the full cast, bobbing
  const CAST = ['bush','scout','armed','gunner','legion','reaper'];
  for (let i=0;i<CAST.length;i++){
    const d = BUSHES[CAST[i]];
    const x = W/2 + (i-(CAST.length-1)/2)*140, y = 258 + Math.sin(t*1.6+i)*8;
    sprite(IMG[d.art], x, y, 76, Math.sin(t*2+i)*0.07, null, i % 2 === 1);
    ctx.font = '9px ui-monospace,monospace';
    ctx.fillStyle = 'rgba(190,220,180,.6)';
    ctx.fillText(d.name, x, y + 56);
  }
  // and the two who are on your side
  sprite(IMG.hero,   74,  470, 116, Math.sin(t*1.4)*0.07);
  sprite(IMG.clean, W-74, 470, 104, Math.sin(t*1.7)*0.07, null, true);
  ctx.font = '9px ui-monospace,monospace';
  ctx.fillStyle = 'rgba(190,220,180,.55)';
  ctx.fillText('YOU', 74, 538);
  ctx.fillText('CLEAN-O · DO NOT SHOOT', W-74, 538);

  ctx.font = '13px ui-monospace,monospace';
  ctx.fillStyle = '#9fbf98';
  ctx.fillText('MOVE  mouse / WASD / arrows        FIRE  automatic, your hands are full', W/2, 344);
  ctx.fillText('SHIFT  slow & precise      P  pause      M  mute', W/2, 364);

  ctx.fillStyle = '#dff3d6';
  ctx.font = '13px ui-monospace,monospace';
  ctx.fillText('STALL ' + save.stall + '   ·   PLY ' + save.ply + '   ·   BEST ' + save.bestSheets.toLocaleString() + ' SHEETS   ·   DEEPEST LEVEL ' + save.bestLevel, W/2, 396);

  // unlock ladder
  ctx.font = '11px ui-monospace,monospace';
  let y = 428;
  for (const u of UNLOCKS){
    const got = save.ply >= u.ply;
    ctx.fillStyle = got ? '#7ee08a' : 'rgba(180,200,175,.34)';
    ctx.fillText((got ? '● ' : '○ ') + u.name + (got ? '' : '  —  ' + u.ply + ' ply') + '   ' + u.desc, W/2, y);
    y += 19;
  }

  ctx.font = 'bold 17px ui-monospace,monospace';
  ctx.fillStyle = Math.sin(performance.now()/280) > 0 ? '#ffd45e' : '#c9a83f';
  ctx.fillText('CLICK or press SPACE to start wiping', W/2, H-26);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawWipeScreen(){
  drawPanel();
  ctx.save();
  ctx.textAlign = 'center';
  spriteCrop(IMG.badwipe, 132, H/2 + 30, 300, 250, 0, 1004, 880, 0.85);
  sprite(IMG.king, W - 118, H/2 + 40, 250, Math.sin(performance.now()/500)*0.05, 0.8);
  ctx.font = 'bold 54px ui-monospace,monospace';
  ctx.fillStyle = '#ff6b5e';
  ctx.shadowColor = '#8a1f16'; ctx.shadowBlur = 24;
  ctx.fillText('BUSHWHACKED', W/2, 130);
  ctx.shadowBlur = 0;

  ctx.font = '14px ui-monospace,monospace';
  ctx.fillStyle = '#cfe8c6';
  ctx.fillText('the hedge got you on level ' + level, W/2, 162);

  ctx.font = '15px ui-monospace,monospace';
  ctx.fillStyle = '#dff3d6';
  ctx.fillText('SHEETS  ' + sheets.toLocaleString() + (sheets >= save.bestSheets ? '   ★ NEW BEST' : '   (best ' + save.bestSheets.toLocaleString() + ')'), W/2, 216);
  ctx.fillText('PLY EARNED  +' + plyEarned + '   ·   LIFETIME  ' + save.ply, W/2, 242);

  // the payoff: the run isn't erased, it escalates
  ctx.font = 'bold 21px ui-monospace,monospace';
  ctx.fillStyle = '#8ef0a8';
  ctx.fillText('STALL ' + save.stall + ' UNLOCKED', W/2, 306);
  ctx.font = '13px ui-monospace,monospace';
  ctx.fillStyle = '#9fbf98';
  ctx.fillText('every level reseeds: new key, new changes, new palette', W/2, 332);
  ctx.fillText('the bushes come faster, angrier, and in worse shapes', W/2, 352);
  ctx.fillText('your unlocks carry over — you never start from nothing', W/2, 372);

  const nu = nextUnlock();
  if (nu){
    ctx.fillStyle = '#ffd45e';
    ctx.font = '14px ui-monospace,monospace';
    ctx.fillText('NEXT UNLOCK: ' + nu.name + ' — ' + (nu.ply - save.ply) + ' ply away', W/2, 424);
    ctx.font = '12px ui-monospace,monospace';
    ctx.fillStyle = '#cfe8c6';
    ctx.fillText(nu.desc, W/2, 444);
  } else {
    ctx.fillStyle = '#ffd45e';
    ctx.font = '14px ui-monospace,monospace';
    ctx.fillText('EVERY PLY UNLOCKED. now just survive.', W/2, 424);
  }

  ctx.font = 'bold 17px ui-monospace,monospace';
  ctx.fillStyle = Math.sin(performance.now()/280) > 0 ? '#ffd45e' : '#c9a83f';
  ctx.fillText('CLICK or press SPACE — go again, louder', W/2, H-46);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawPause(){
  drawPanel();
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 42px ui-monospace,monospace';
  ctx.fillStyle = '#8ef0a8';
  ctx.fillText('PAUSED', W/2, H/2 - 10);
  ctx.font = '13px ui-monospace,monospace';
  ctx.fillStyle = '#9fbf98';
  ctx.fillText('P to resume   ·   M to ' + (save.muted ? 'unmute' : 'mute'), W/2, H/2 + 20);
  ctx.restore();
  ctx.textAlign = 'left';
}

/* roundRect fallback for older engines */
if (!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    this.closePath();
    return this;
  };
}

/* boot */
bank = makeBank(save.stall*7919 + 104729 + 13, 1, save.stall);
requestAnimationFrame(frame);
})();
